name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"  # runs daily at midnight
  workflow_dispatch:  # allows manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: LAN-SHLOK
          outputs: |
            dist/github-snake.svg?color_snake=#cc3300&color_dots=#161b22,#3d1f00,#8a4500,#d46a00,#daa520
            dist/github-snake-dark.svg?color_snake=#cc3300&color_dots=#0d1117,#2a1500,#5c2e00,#994d00,#daa520
            dist/ocean.gif?color_snake=#cc3300&color_dots=#0d1117,#2a1500,#5c2e00,#994d00,#daa520

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

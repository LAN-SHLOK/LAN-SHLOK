<svg xmlns="http://www.w3.org/2000/svg" width="800" height="130" viewBox="0 0 800 130">
  <defs>
    <linearGradient id="scrollBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1610"/>
      <stop offset="50%" style="stop-color:#141008"/>
      <stop offset="100%" style="stop-color:#1a1610"/>
    </linearGradient>
    <linearGradient id="goldB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b6914"/>
      <stop offset="50%" style="stop-color:#daa520"/>
      <stop offset="100%" style="stop-color:#8b6914"/>
    </linearGradient>
  </defs>
  <!-- Scroll body -->
  <rect x="60" y="15" width="680" height="100" fill="url(#scrollBg)" rx="3" stroke="url(#goldB)" stroke-width="1.2"/>
  <!-- Scroll roll left -->
  <ellipse cx="60" cy="65" rx="10" ry="50" fill="#1a1610" stroke="#8b6914" stroke-width="1"/>
  <line x1="55" y1="18" x2="55" y2="112" stroke="#5a4510" stroke-width="0.5" opacity="0.4"/>
  <line x1="52" y1="20" x2="52" y2="110" stroke="#3d2d18" stroke-width="0.3" opacity="0.3"/>
  <!-- Scroll roll right -->
  <ellipse cx="740" cy="65" rx="10" ry="50" fill="#1a1610" stroke="#8b6914" stroke-width="1"/>
  <line x1="745" y1="18" x2="745" y2="112" stroke="#5a4510" stroke-width="0.5" opacity="0.4"/>
  <line x1="748" y1="20" x2="748" y2="110" stroke="#3d2d18" stroke-width="0.3" opacity="0.3"/>
  <!-- Inner decorative line -->
  <rect x="80" y="22" width="640" height="86" fill="none" rx="1" stroke="#5a4510" stroke-width="0.4" opacity="0.3"/>
  <!-- Small quill icon top-left -->
  <g transform="translate(88, 28) rotate(-30)">
    <line x1="0" y1="0" x2="0" y2="14" stroke="#8b6914" stroke-width="1"/>
    <polygon points="0,14 -2,18 2,18" fill="#8b6914"/>
  </g>
  <!-- Quote text -->
  <text x="400" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="12.5" fill="#aaa" font-style="italic">"Seeker of fire... I am Shlok Patel.</text>
  <text x="400" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="12.5" fill="#aaa" font-style="italic">A Sorcerer who weaves React spells, and a Cleric who</text>
  <text x="400" y="84" text-anchor="middle" font-family="Georgia, serif" font-size="12.5" fill="#aaa" font-style="italic">commands the power of Python. My summon sign is placed...</text>
  <text x="400" y="102" text-anchor="middle" font-family="Georgia, serif" font-size="12.5" fill="#aaa" font-style="italic">I seek worthy companions for an internship quest."</text>
</svg>

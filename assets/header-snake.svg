  </g>
  <text x="400" y="27" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#daa520" letter-spacing="5">CONTRIBUTION SNAKE</text>
  <!-- Right snake -->
  <g transform="translate(535, 16)">
    <path d="M 0,6 Q 4,12 8,6 Q 12,0 16,6 Q 20,12 24,6" fill="none" stroke="#daa520" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="24" cy="6" r="2" fill="#daa520"/>
    <circle cx="24.5" cy="5.5" r="0.5" fill="#cc0000"/>
  </g>
  <line x1="570" y1="22" x2="770" y2="22" stroke="url(#fadeR)" stroke-width="0.8"/>

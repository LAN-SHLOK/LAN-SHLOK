<svg xmlns="http://www.w3.org/2000/svg" width="900" height="30" viewBox="0 0 900 30">
  <defs>
    <linearGradient id="lineL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#daa520;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="lineR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#daa520;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff8c00;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#cc3300;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#660000;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Left decorative end -->
  <path d="M 80,15 L 95,10 L 95,20 Z" fill="#8b6914" opacity="0.5"/>
  <!-- Left line -->
  <line x1="95" y1="15" x2="410" y2="15" stroke="url(#lineL)" stroke-width="1"/>
  <!-- Left inner flourish -->
  <path d="M 390,15 Q 410,5 420,15 Q 410,25 390,15" fill="none" stroke="#daa520" stroke-width="0.8" opacity="0.6"/>
  <!-- Center diamond -->
  <polygon points="450,5 460,15 450,25 440,15" fill="#8b6914" stroke="#daa520" stroke-width="0.8" filter="url(#glow)"/>
  <!-- Center ember -->
  <circle cx="450" cy="15" r="4" fill="url(#ember)" filter="url(#glow)"/>
  <circle cx="450" cy="15" r="1.5" fill="#ffcc00" opacity="0.9"/>
  <!-- Right inner flourish -->
  <path d="M 510,15 Q 490,5 480,15 Q 490,25 510,15" fill="none" stroke="#daa520" stroke-width="0.8" opacity="0.6"/>
  <!-- Right line -->
  <line x1="490" y1="15" x2="805" y2="15" stroke="url(#lineR)" stroke-width="1"/>
  <!-- Right decorative end -->
  <path d="M 820,15 L 805,10 L 805,20 Z" fill="#8b6914" opacity="0.5"/>
  <!-- Small accent dots -->
  <circle cx="370" cy="15" r="1" fill="#daa520" opacity="0.4"/>
  <circle cx="350" cy="15" r="0.7" fill="#daa520" opacity="0.3"/>
  <circle cx="530" cy="15" r="1" fill="#daa520" opacity="0.4"/>
  <circle cx="550" cy="15" r="0.7" fill="#daa520" opacity="0.3"/>
</svg>

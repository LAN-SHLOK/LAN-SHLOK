<svg xmlns="http://www.w3.org/2000/svg" width="800" height="24" viewBox="0 0 800 24">
  <defs>
    <linearGradient id="fadeL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#daa520;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#daa520;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#daa520;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#daa520;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="fl" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#cc3300"/>
      <stop offset="60%" style="stop-color:#ff6600"/>
      <stop offset="100%" style="stop-color:#ffaa00;stop-opacity:0.5"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- Left scrollwork -->
  <path d="M 60,12 Q 70,5 80,12 Q 90,19 100,12" fill="none" stroke="#8b6914" stroke-width="0.8" opacity="0.5"/>
  <!-- Left line -->
  <line x1="100" y1="12" x2="370" y2="12" stroke="url(#fadeL)" stroke-width="0.8"/>
  <!-- Left diamond -->
  <polygon points="375,8 380,12 375,16 370,12" fill="#5a4510" stroke="#8b6914" stroke-width="0.5"/>
  <!-- Center bonfire -->
  <g transform="translate(400, 12)">
    <line x1="0" y1="4" x2="0" y2="-2" stroke="#666" stroke-width="1"/>
    <path d="M 0,-8 Q -4,-4 -3,0 Q -1,3 0,0 Q 1,3 3,0 Q 4,-4 0,-8" fill="url(#fl)" filter="url(#g)" opacity="0.9"/>
  </g>
  <!-- Right diamond -->
  <polygon points="425,8 430,12 425,16 420,12" fill="#5a4510" stroke="#8b6914" stroke-width="0.5"/>
  <!-- Right line -->
  <line x1="430" y1="12" x2="700" y2="12" stroke="url(#fadeR)" stroke-width="0.8"/>
  <!-- Right scrollwork -->
  <path d="M 700,12 Q 710,5 720,12 Q 730,19 740,12" fill="none" stroke="#8b6914" stroke-width="0.8" opacity="0.5"/>
</svg>

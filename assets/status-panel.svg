<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#151510"/>
      <stop offset="100%" style="stop-color:#0d0d0a"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b6914"/>
      <stop offset="50%" style="stop-color:#daa520"/>
      <stop offset="100%" style="stop-color:#8b6914"/>
    </linearGradient>
  </defs>
  <!-- Panel background -->
  <rect x="20" y="10" width="760" height="200" fill="url(#panelBg)" rx="3" stroke="url(#goldBorder)" stroke-width="1.5" opacity="0.95"/>
  <!-- Inner border -->
  <rect x="30" y="18" width="740" height="184" fill="none" rx="2" stroke="#8b6914" stroke-width="0.5" opacity="0.4"/>
  <!-- Section label -->
  <rect x="300" y="4" width="200" height="18" fill="#0d0d0a" rx="2"/>
  <text x="400" y="17" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#daa520" letter-spacing="3">STATUS</text>
  <!-- Stats -->
  <text x="60" y="55" font-family="'Courier New', monospace" font-size="13" fill="#8b8b8b">NAME</text>
  <text x="200" y="55" font-family="'Courier New', monospace" font-size="13" fill="#cccccc">Shlok Patel (LAN-SHLOK)</text>
  <text x="60" y="80" font-family="'Courier New', monospace" font-size="13" fill="#8b8b8b">CLASS</text>
  <text x="200" y="80" font-family="'Courier New', monospace" font-size="13" fill="#cccccc">Sorcerer / Cleric</text>
  <text x="60" y="105" font-family="'Courier New', monospace" font-size="13" fill="#8b8b8b">COVENANT</text>
  <text x="200" y="105" font-family="'Courier New', monospace" font-size="13" fill="#cccccc">Heirs of the Sun</text>
  <text x="60" y="130" font-family="'Courier New', monospace" font-size="13" fill="#8b8b8b">QUEST</text>
  <text x="200" y="130" font-family="'Courier New', monospace" font-size="13" fill="#cccccc">Seeking Internship &amp; Expanding Tech Stack</text>
  <!-- Divider line -->
  <line x1="50" y1="148" x2="750" y2="148" stroke="#8b6914" stroke-width="0.5" opacity="0.4"/>
  <!-- Bonfire activities -->
  <text x="60" y="168" font-family="'Courier New', monospace" font-size="12" fill="#666666">RESTING AT BONFIRE</text>
  <text x="60" y="190" font-family="'Courier New', monospace" font-size="12" fill="#999999">Anime &amp; Sitcoms  |  Music  |  Beyblade  |  Pokemon</text>
</svg>

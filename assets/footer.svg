<svg xmlns="http://www.w3.org/2000/svg" width="800" height="70" viewBox="0 0 800 70">
  <defs>
    <linearGradient id="fadeL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#daa520;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#daa520;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#daa520;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#daa520;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="fl1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#cc3300"/>
      <stop offset="50%" style="stop-color:#ff6600"/>
      <stop offset="100%" style="stop-color:#ffcc00;stop-opacity:0.4"/>
    </linearGradient>
    <radialGradient id="emb" cx="50%" cy="60%" r="50%">
      <stop offset="0%" style="stop-color:#ff6600;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#ff6600;stop-opacity:0"/>
    </radialGradient>
    <filter id="g"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- Lines -->
  <line x1="80" y1="22" x2="360" y2="22" stroke="url(#fadeL)" stroke-width="0.8"/>
  <line x1="440" y1="22" x2="720" y2="22" stroke="url(#fadeR)" stroke-width="0.8"/>
  <!-- Center bonfire scene -->
  <g transform="translate(400, 22)">
    <circle cx="0" cy="-5" r="20" fill="url(#emb)"/>
    <!-- coiled sword -->
    <rect x="-1" y="-22" width="2" height="20" fill="#888" rx="0.5"/>
    <polygon points="0,-25 -2,-22 2,-22" fill="#aaa"/>
    <rect x="-5" y="-3" width="10" height="2" fill="#666" rx="0.5"/>
    <!-- fire -->
    <path d="M 0,-16 Q -6,-8 -4,0 Q -1,4 0,-1 Q 1,4 4,0 Q 6,-8 0,-16" fill="url(#fl1)" filter="url(#g)" opacity="0.85"/>
    <!-- logs -->
    <line x1="-8" y1="4" x2="8" y2="2" stroke="#4a3520" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-6" y1="2" x2="7" y2="5" stroke="#3d2d18" stroke-width="2" stroke-linecap="round"/>
    <!-- embers -->
    <circle cx="-5" cy="-18" r="0.8" fill="#ffaa00" opacity="0.6"/>
    <circle cx="3" cy="-20" r="0.5" fill="#ff6600" opacity="0.5"/>
    <circle cx="-2" cy="-22" r="0.6" fill="#ffcc44" opacity="0.4"/>
  </g>
  <!-- Scrollwork left -->
  <path d="M 70,22 Q 75,16 80,22" fill="none" stroke="#8b6914" stroke-width="0.8" opacity="0.5"/>
  <!-- Scrollwork right -->
  <path d="M 730,22 Q 725,16 720,22" fill="none" stroke="#8b6914" stroke-width="0.8" opacity="0.5"/>
  <!-- Quote -->
  <text x="400" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#555" font-style="italic" letter-spacing="1">"Don't give up, skeleton!"</text>
</svg>

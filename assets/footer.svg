<svg xmlns="http://www.w3.org/2000/svg" width="800" height="60" viewBox="0 0 800 60">
  <defs>
    <linearGradient id="fadeL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#daa520;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#daa520;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#daa520;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#daa520;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff8c00;stop-opacity:0.8"/>
      <stop offset="60%" style="stop-color:#cc3300;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#660000;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <line x1="80" y1="20" x2="370" y2="20" stroke="url(#fadeL)" stroke-width="0.8"/>
  <line x1="430" y1="20" x2="720" y2="20" stroke="url(#fadeR)" stroke-width="0.8"/>
  <!-- Center bonfire icon -->
  <circle cx="400" cy="20" r="6" fill="url(#ember)" filter="url(#glow)"/>
  <circle cx="400" cy="20" r="2" fill="#ffcc00" opacity="0.9"/>
  <!-- Quote -->
  <text x="400" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#666666" font-style="italic">"Don't give up, skeleton!"</text>
</svg>
